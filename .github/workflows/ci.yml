name: CI

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

# Cancel in-progress runs for the same workflow and branch/tag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.6'
  TIMEOUT_MINUTES_DEFAULT: 30
  TIMEOUT_MINUTES_BUILD: 45
  # Action versions
  CHECKOUT_ACTION_VERSION: 'v4'
  FLUTTER_ACTION_VERSION: 'v2'
  SETUP_JAVA_ACTION_VERSION: 'v4'
  UPLOAD_ARTIFACT_ACTION_VERSION: 'v4.5.0'
  DOWNLOAD_ARTIFACT_ACTION_VERSION: 'v4.1.3'
  CODECOV_ACTION_VERSION: 'v4'
  CONFIGURE_PAGES_ACTION_VERSION: 'v5'
  UPLOAD_PAGES_ARTIFACT_ACTION_VERSION: 'v3'
  DEPLOY_PAGES_ACTION_VERSION: 'v4'

jobs:
  # Quality checks: format, analyze, and test
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.TIMEOUT_MINUTES_DEFAULT || '30') }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@${{ env.CHECKOUT_ACTION_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@${{ env.FLUTTER_ACTION_VERSION }}
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'

      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Generate build_runner artifacts
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@${{ env.CODECOV_ACTION_VERSION }}
        if: success()
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
        continue-on-error: true

  # Build Web app
  build-web:
    name: Build Web
    needs: quality-checks
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.TIMEOUT_MINUTES_DEFAULT || '30') }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@${{ env.CHECKOUT_ACTION_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@${{ env.FLUTTER_ACTION_VERSION }}
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate build_runner artifacts
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web
        run: flutter build web --release --base-href '/${{ github.event.repository.name }}/'

      - name: Upload web build artifact
        uses: actions/upload-artifact@${{ env.UPLOAD_ARTIFACT_ACTION_VERSION }}
        with:
          name: web-build
          path: build/web/
          retention-days: 30

  # Build Android APK and App Bundle
  build-android:
    name: Build Android
    needs: quality-checks
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.TIMEOUT_MINUTES_BUILD || '45') }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@${{ env.CHECKOUT_ACTION_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@${{ env.SETUP_JAVA_ACTION_VERSION }}
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@${{ env.FLUTTER_ACTION_VERSION }}
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate build_runner artifacts
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@${{ env.UPLOAD_ARTIFACT_ACTION_VERSION }}
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@${{ env.UPLOAD_ARTIFACT_ACTION_VERSION }}
        with:
          name: android-appbundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # Build Windows desktop app
  build-windows:
    name: Build Windows
    needs: quality-checks
    runs-on: windows-latest
    timeout-minutes: ${{ fromJSON(vars.TIMEOUT_MINUTES_BUILD || '45') }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@${{ env.CHECKOUT_ACTION_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@${{ env.FLUTTER_ACTION_VERSION }}
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate build_runner artifacts
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows app
        run: flutter build windows --release

      - name: Create Windows archive
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/windows/crubik-windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@${{ env.UPLOAD_ARTIFACT_ACTION_VERSION }}
        with:
          name: windows-build
          path: build/windows/crubik-windows-x64.zip
          retention-days: 30

  # Build macOS desktop app
  build-macos:
    name: Build macOS
    needs: quality-checks
    runs-on: macos-latest
    timeout-minutes: ${{ fromJSON(vars.TIMEOUT_MINUTES_BUILD || '45') }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@${{ env.CHECKOUT_ACTION_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@${{ env.FLUTTER_ACTION_VERSION }}
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate build_runner artifacts
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build macOS app
        run: flutter build macos --release

      - name: Create macOS archive
        run: |
          cd build/macos/Build/Products/Release
          zip -r crubik-macos-universal.zip crubik.app
          mv crubik-macos-universal.zip ../../../../

      - name: Upload macOS artifact
        uses: actions/upload-artifact@${{ env.UPLOAD_ARTIFACT_ACTION_VERSION }}
        with:
          name: macos-build
          path: build/crubik-macos-universal.zip
          retention-days: 30

  # Build Linux desktop app
  build-linux:
    name: Build Linux
    needs: quality-checks
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.TIMEOUT_MINUTES_BUILD || '45') }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@${{ env.CHECKOUT_ACTION_VERSION }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@${{ env.FLUTTER_ACTION_VERSION }}
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate build_runner artifacts
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Linux app
        run: flutter build linux --release

      - name: Create Linux archive
        run: |
          cd build/linux/x64/release/bundle
          tar -czf crubik-linux-x64.tar.gz *
          mv crubik-linux-x64.tar.gz ../../../../

      - name: Upload Linux artifact
        uses: actions/upload-artifact@${{ env.UPLOAD_ARTIFACT_ACTION_VERSION }}
        with:
          name: linux-build
          path: build/crubik-linux-x64.tar.gz
          retention-days: 30

  # Deploy web app to GitHub Pages (only on main branch or tags)
  # Temporarily disabled - GitHub Pages requires paid subscription
  deploy-web:
    name: Deploy to GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    if: false  # Temporarily disabled
    
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      contents: read
      pages: write
      id-token: write
    
    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Download web build artifact
        uses: actions/download-artifact@${{ env.DOWNLOAD_ARTIFACT_ACTION_VERSION }}
        with:
          name: web-build
          path: ./web-build

      - name: Setup Pages
        uses: actions/configure-pages@${{ env.CONFIGURE_PAGES_ACTION_VERSION }}

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@${{ env.UPLOAD_PAGES_ARTIFACT_ACTION_VERSION }}
        with:
          path: ./web-build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@${{ env.DEPLOY_PAGES_ACTION_VERSION }}
