targets:
  $default:
    builders:
      build_web_compilers:entrypoint:
        generate_for:
          - web/drift_worker_entrypoint.dart
          - web/cube_solver_worker_entrypoint.dart
        options:
          compilers:
            dart2js:
              args:
                - -O4
                - --no-source-maps
      crubik:web_worker_copy:
        enabled: true
      crubik:external_asset:
        enabled: true
        generate_for:
          - tool/sqlite3_wasm_asset.json
        options:
          input_path: tool/sqlite3_wasm_asset.json
          output_path: web/sqlite3.wasm
          locked_package: sqlite3
          timeout_seconds: 60
          maximum_bytes: 5242880

builders:
  web_worker_copy:
    import: "tool/web_worker_copy_builder.dart"
    builder_factories:
      - webWorkerCopyBuilder
    build_extensions:
      "web/drift_worker_entrypoint.dart.js":
        - "web/drift_worker.dart.js"
      "web/cube_solver_worker_entrypoint.dart.js":
        - "web/cube_solver_worker.dart.js"
    auto_apply: none
    build_to: source
    required_inputs:
      - ".dart.js"
  external_asset:
    import: "tool/external_asset_fetcher.dart"
    builder_factories:
      - externalAssetFetcher
    build_extensions:
      "^tool/sqlite3_wasm_asset.json":
        - "web/sqlite3.wasm"
    auto_apply: none
    build_to: source
